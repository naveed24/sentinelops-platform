name: Maven tests

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

# Cancel obsolete PR/feature-branch runs, but never cancel a main verification run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run verification
        run: mvn --batch-mode --no-transfer-progress clean verify

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Export generated dashboard dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dependency-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Run dashboard tests
        run: npm test
      - name: Typecheck and build dashboard
        run: npm run build
      - name: Publish production dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: sentinelops-dashboard-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

