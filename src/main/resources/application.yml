spring:
  application:
    name: sentinelops-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${DB_USERNAME:sentinelops}
    password: ${DB_PASSWORD:sentinelops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sentinelops:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: sentinelops
      ttl: PT1H

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
